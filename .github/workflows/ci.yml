name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # npm exists here for exactly two things: minifying the tracker script
      # and (below) driving Playwright. The dashboard itself is hand-written
      # HTML/CSS/JS embedded via go:embed — a plain `go build ./...` further
      # down needs no npm step at all.
      - run: npm ci

      # athar.ts is real TypeScript; a plain `npm run build:tracker` (esbuild)
      # would happily ship it even if it no longer typechecks, since esbuild
      # only strips types, it never checks them. This is the gate that
      # actually enforces the types mean something — hard failure, no
      # continue-on-error.
      - name: Tracker typecheck
        run: npm run typecheck

      # The committed athar.js / athar.min.js (backend/internal/tracker/) are
      # generated, not hand-written. Fail if either has drifted from athar.ts
      # so the three can never silently disagree.
      - name: Tracker build up to date
        run: node scripts/build-tracker.mjs --check

      # format.js / countries.js are the dashboard's only real logic; this is
      # their test coverage (node:test, no vitest). The glob must actually
      # match files, so this cannot pass by silently running nothing.
      - name: Dashboard JS tests
        run: |
          shopt -s nullglob
          files=(scripts/jstest/*.test.mjs)
          [ "${#files[@]}" -gt 0 ] || { echo "no test files matched"; exit 1; }
          node --test "${files[@]}"

      # gofmt -l exits 0 whether or not it found anything; the file list is the
      # signal, so the gate has to test the output, not the status.
      - name: Go gofmt
        run: |
          unformatted="$(gofmt -l backend/)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
          echo "backend/ is gofmt-clean"

      - name: Go vet
        run: go vet ./backend/...

      # Covers the whole server, including the embedded dashboard: security
      # headers, that auth cannot be bypassed, and that the embed is present
      # and references no external origin.
      - name: Go tests
        run: go test ./backend/...

      - name: Plain go build (no tags — the path every self-hoster actually builds)
        run: go build -o athar-plain ./backend/cmd/athar

      - name: Verify plain binary
        run: ./athar-plain --version

      - name: Build release binary (marketing site embedded)
        run: |
          mkdir -p backend/cmd/athar/site
          cp -r site/* backend/cmd/athar/site/
          go build -tags embed_site -o athar ./backend/cmd/athar
          rm -rf backend/cmd/athar/site

      - name: Verify release binary
        run: ./athar --version
