<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Athar</title>
  <!-- Three offset rings, densest at the point of contact and fading outward:
       a trace spreading from where something landed. أثر means both "trace" and
       "impact", and the mark is meant to read as either. -->
  <rect width="64" height="64" rx="15" fill="#0E0E11"/>
  <circle cx="32" cy="32" r="6" fill="#E9A23B"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#E9A23B" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#E9A23B" stroke-opacity="0.22" stroke-width="2.5"/>
</svg>
