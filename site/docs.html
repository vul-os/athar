<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Athar docs</title>
<meta name="description" content="Athar documentation">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='9' fill='%230E0E10'/%3E%3Ccircle cx='17' cy='17' r='11' fill='none' stroke='%23e9a23b' stroke-width='2' opacity='.55'/%3E%3Ccircle cx='17' cy='17' r='6.5' fill='none' stroke='%23e9a23b' stroke-width='2' opacity='.85'/%3E%3Ccircle cx='17' cy='17' r='2.4' fill='%23e9a23b'/%3E%3C/svg%3E">
<style>*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#09090B; --bg-soft:#0E0E10; --panel:#131316; --panel-2:#18181B;
  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.13);
  --text:#FAFAFA; --muted:#A1A1AA; --faint:#71717A;
  --radius:16px; --max:1120px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","Geist Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:16px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(1100px 600px at 80% -10%, color-mix(in srgb,var(--accent) 10%, transparent), transparent 60%),
  radial-gradient(900px 500px at -10% 10%, color-mix(in srgb,var(--accent-2) 8%, transparent), transparent 55%),
  var(--bg);}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.accent{color:var(--accent)}

/* Header */
.site-header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 72%, transparent);border-bottom:1px solid var(--border)}
.nav{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:18px;letter-spacing:-.03em}
.brand .tile{width:34px;height:34px;border-radius:9px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 4px 14px rgba(0,0,0,.35);background:#0E0E10;display:grid;place-items:center}
.brand .tile svg{width:100%;height:100%;display:block}
.nav-spacer{flex:1}
.nav-links{display:flex;align-items:center;gap:22px}
.nav-links a{color:var(--muted);font-size:14.5px;font-weight:500;transition:color .15s}
.nav-links a:hover{color:var(--text)}
.vulos-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--border-2);border-radius:999px;font-size:13px;color:var(--muted);transition:border-color .15s,color .15s}
.vulos-badge:hover{border-color:var(--accent);color:var(--text)}
.vulos-badge img{width:16px;height:16px;border-radius:4px}
@media(max-width:760px){.nav-links{display:none}}

/* Footer */
.site-footer{border-top:1px solid var(--border);margin-top:40px;padding:40px 0}
.foot{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.foot .left{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.foot .left img{width:20px;height:20px;border-radius:5px}
.foot .links{display:flex;gap:20px;flex-wrap:wrap}
.foot .links a{color:var(--muted);font-size:14px}
.foot .links a:hover{color:var(--text)}

/* Docs viewer */
.docs-shell{display:grid;grid-template-columns:248px 1fr;gap:36px;align-items:start;padding:34px 0 70px}
@media(max-width:860px){.docs-shell{grid-template-columns:1fr}}
.docs-nav{position:sticky;top:84px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:14px}
.docs-nav .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:6px 10px}
.docs-nav a{display:block;padding:8px 11px;border-radius:9px;color:var(--muted);font-size:14.5px;font-weight:500;transition:.15s}
.docs-nav a:hover{background:rgba(255,255,255,.04);color:var(--text)}
.docs-nav a.active{background:color-mix(in srgb,var(--accent) 14%, transparent);color:var(--text)}
@media(max-width:860px){.docs-nav{position:static}}
.docs-main{min-width:0}
.markdown{font-size:16px}
.markdown>*:first-child{margin-top:0}
.markdown h1{font-size:34px;letter-spacing:-.03em;margin:.2em 0 .5em;border-bottom:1px solid var(--border);padding-bottom:.3em}
.markdown h2{font-size:25px;letter-spacing:-.02em;margin:1.6em 0 .6em;border-bottom:1px solid var(--border);padding-bottom:.25em}
.markdown h3{font-size:19px;margin:1.4em 0 .5em}
.markdown h4{font-size:16px;margin:1.3em 0 .4em;color:var(--text)}
.markdown p,.markdown li{color:#D4D4D8}
.markdown a{color:var(--accent);text-decoration:none}
.markdown a:hover{text-decoration:underline}
.markdown code{font-family:var(--mono);font-size:.88em;background:rgba(255,255,255,.07);padding:2px 6px;border-radius:6px}
.markdown pre{background:#0C0C0E;border:1px solid var(--border-2);border-radius:12px;padding:16px 18px;overflow:auto}
.markdown pre code{background:none;padding:0;font-size:13.5px;line-height:1.7;color:#D4D4D8}
.markdown blockquote{margin:1em 0;padding:.4em 1em;border-left:3px solid var(--accent);background:rgba(255,255,255,.03);color:var(--muted);border-radius:0 8px 8px 0}
.markdown table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:14.5px;display:block;overflow:auto}
.markdown th,.markdown td{border:1px solid var(--border-2);padding:9px 12px;text-align:left}
.markdown th{background:var(--panel);font-weight:600}
.markdown img{border-radius:10px;margin:1em 0;border:1px solid var(--border)}
.markdown hr{border:none;border-top:1px solid var(--border);margin:2em 0}
.docs-title{font-size:13px;color:var(--faint);margin-bottom:6px}
.docs-error{color:#FCA5A5;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.25);padding:14px 16px;border-radius:10px}
</style>
<style>:root{--accent:#e9a23b;--accent-2:#c77b2e}</style>
<script src="./assets/vendor/marked.umd.js"></script>
</head>
<body>
<header class="site-header"><div class="wrap nav">
    <a class="brand" href="./index.html"><span class="tile">
      <svg viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="34" height="34" rx="9" fill="#0E0E10"/>
        <circle cx="17" cy="17" r="11" fill="none" stroke="#e9a23b" stroke-width="2" opacity=".55"/>
        <circle cx="17" cy="17" r="6.5" fill="none" stroke="#e9a23b" stroke-width="2" opacity=".85"/>
        <circle cx="17" cy="17" r="2.4" fill="#e9a23b"/>
      </svg>
    </span>Athar</a>
    <div class="nav-spacer"></div>
    <nav class="nav-links">
      <a href="./index.html#features">Features</a>
      <a href="./index.html#privacy">Privacy</a>
      <a href="./docs.html">Docs</a>
      <a href="https://github.com/vul-os/athar" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <a class="vulos-badge" href="https://vulos.org" target="_blank" rel="noopener" title="Part of Vulos">
      <img src="./assets/vulos-logo.png" alt="Vulos">Part of Vulos
    </a>
  </div></header>
<div class="wrap docs-shell">
  <aside class="docs-nav">
    <div class="label">Athar docs</div>
        <a data-slug="getting-started" href="#getting-started">Getting started</a>
        <a data-slug="install" href="#install">Install</a>
        <a data-slug="tracker" href="#tracker">Tracker script</a>
        <a data-slug="heatmaps" href="#heatmaps">Heatmaps</a>
        <a data-slug="ecommerce" href="#ecommerce">Ecommerce</a>
        <a data-slug="privacy" href="#privacy">Privacy</a>
        <a data-slug="configuration" href="#configuration">Configuration</a>
        <a data-slug="api" href="#api">API</a>
        <a data-slug="self-hosting" href="#self-hosting">Self-hosting</a>
        <a data-slug="architecture" href="#architecture">Architecture</a>
        <a data-slug="roadmap" href="#roadmap">Roadmap</a>
        <a data-slug="changelog" href="#changelog">Changelog</a>
  </aside>
  <main class="docs-main">
    <div class="docs-title" id="crumb"></div>
    <article class="markdown" id="content">Loading…</article>
  </main>
</div>
<footer class="site-footer"><div class="wrap foot">
    <div class="left"><img src="./assets/vulos-logo.png" alt="Vulos"> <span>Part of <a href="https://vulos.org" target="_blank" rel="noopener" style="color:var(--text)">Vulos</a> — open, self-hostable apps. Standalone by design.</span></div>
    <div class="links">
      <a href="./docs.html">Docs</a>
      <a href="https://github.com/vul-os/athar" target="_blank" rel="noopener">GitHub</a>
      <a href="./LICENSE.txt">License</a>
      <a href="https://vulos.org" target="_blank" rel="noopener">vulos.org</a>
    </div>
  </div></footer>
<script>
// The site is served from the repo root; docs render straight from the repo's own markdown.
const DOCS = [
  {"slug":"getting-started","title":"Getting started","path":"./docs/getting-started.md"},
  {"slug":"install","title":"Install","path":"./docs/install.md"},
  {"slug":"tracker","title":"Tracker script","path":"./docs/tracker.md"},
  {"slug":"heatmaps","title":"Heatmaps","path":"./docs/heatmaps.md"},
  {"slug":"ecommerce","title":"Ecommerce","path":"./docs/ecommerce.md"},
  {"slug":"privacy","title":"Privacy","path":"./docs/privacy.md"},
  {"slug":"configuration","title":"Configuration","path":"./docs/configuration.md"},
  {"slug":"api","title":"API","path":"./docs/api.md"},
  {"slug":"self-hosting","title":"Self-hosting","path":"./docs/self-hosting.md"},
  {"slug":"architecture","title":"Architecture","path":"./docs/architecture.md"},
  {"slug":"roadmap","title":"Roadmap","path":"./docs/roadmap.md"},
  {"slug":"changelog","title":"Changelog","path":"./docs/changelog.md"}
];
const bySlug = Object.fromEntries(DOCS.map(d=>[d.slug,d]));
const byFile = Object.fromEntries(DOCS.map(d=>[d.path.split('/').pop().toLowerCase(),d]));
const content = document.getElementById('content');
const crumb = document.getElementById('crumb');

if (window.marked && marked.setOptions) marked.setOptions({ gfm:true, breaks:false });

function setActive(slug){
  document.querySelectorAll('.docs-nav a').forEach(a=>a.classList.toggle('active', a.dataset.slug===slug));
}

async function load(slug){
  const doc = bySlug[slug] || DOCS[0];
  setActive(doc.slug);
  crumb.textContent = doc.title;
  content.innerHTML = 'Loading…';
  try {
    const res = await fetch(doc.path, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const md = await res.text();
    content.innerHTML = marked.parse(md);
    // Cross-doc links (e.g. api.md, ../roadmap.md#phase-4) become sidebar navigation.
    content.querySelectorAll('a[href]').forEach(a=>{
      const h=a.getAttribute('href')||'';
      if(/^(https?:|#|mailto:)/i.test(h)) return;
      const m=h.match(/([^\/]+\.md)(#.*)?$/i);
      const target = m && byFile[m[1].toLowerCase()];
      if(target) a.setAttribute('href','#'+target.slug);
    });
    content.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
    window.scrollTo({top:0});
  } catch(err){
    content.innerHTML = '<div class="docs-error">Could not load <code>'+doc.path.split('/').pop()+'</code> — '+err.message+'</div>';
  }
}

function current(){ return (location.hash||'').replace('#','') || DOCS[0].slug; }
window.addEventListener('hashchange', ()=>load(current()));
load(current());
</script>
</body>
</html>
