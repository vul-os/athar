<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athar</title>

<!-- Resolve the theme before first paint, so a load never flashes the wrong
     colours. This must run — and finish — before the stylesheet below is
     allowed to paint, which is why it is a classic (not type="module",
     which defers) <script src> placed first in <head>. External rather than
     inline because the CSP is script-src 'self' with no 'unsafe-inline'. -->
<script src="/theme-init.js"></script>
<link rel="stylesheet" href="/ui.css">

<meta name="description" content="Self-hosted web analytics with heatmaps. Your visitors' data never leaves your server.">
<meta name="theme-color" content="#09090B">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E0E11'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e9a23b'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23e9a23b' stroke-opacity='0.55' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23e9a23b' stroke-opacity='0.22' stroke-width='1.2'/%3E%3C/svg%3E">

<!-- Athar does not track the people who use Athar. -->
<meta name="robots" content="noindex">
</head>
<body>
<div id="root"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
