<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athar</title>

<!-- Resolve the theme before first paint, so a load never flashes the wrong
     colours. This must run — and finish — before the stylesheet below is
     allowed to paint, which is why it is a classic (not type="module",
     which defers) <script src> placed first in <head>. External rather than
     inline because the CSP is script-src 'self' with no 'unsafe-inline'. -->
<script src="/theme-init.js"></script>
<link rel="stylesheet" href="/ui.css">

<meta name="description" content="Self-hosted web analytics with heatmaps. Your visitors' data never leaves your server.">
<meta name="theme-color" content="#09090B">
<!-- Favicon only — no manifest, no service worker, no apple-touch-icon: the
     PWA was deliberately removed in the rewrite and stays removed. A real
     same-origin asset (not a data: URI) so it is servable, cacheable and
     verifiable like any other embedded file; derived from brand/logo.svg,
     see backend/internal/webui/static/favicon.svg. Its own dark backdrop
     square gives it enough contrast in both the light and dark dashboard
     themes, so unlike the in-page logo mark (ui.css .logo-dot/.logo-ring)
     it needs no theme-swapped colour variant. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<!-- Athar does not track the people who use Athar. -->
<meta name="robots" content="noindex">
</head>
<body>
<div id="root"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
